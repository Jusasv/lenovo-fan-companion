name: Build diagnostics
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure native application
        run: cmake -S . -B build -A x64
      - name: Compile with warnings as errors
        run: cmake --build build --config Release
      - name: Test diagnostic interpretation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Exercise read-only report path
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./build/Release/LenovoFanCompanion.exe -ArgumentList @('--report', 'runner-diagnostics.txt') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Diagnostic scan timed out' }
          if ($process.ExitCode -ne 0) { throw 'Diagnostic report failed' }
          $text = Get-Content runner-diagnostics.txt -Raw
          if ($text -notmatch 'No fan commands were sent' -or $text -notmatch 'Fan-control support: unverified') { throw 'Report failed validation' }
      - name: Package diagnostic preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview | Out-Null
          Copy-Item build/Release/LenovoFanCompanion.exe, LICENSE, DIAGNOSTICS.md -Destination preview
      - uses: actions/upload-artifact@v7
        with:
          name: LenovoFanCompanion-diagnostics-windows-x64
          path: preview/
          if-no-files-found: error
      - name: Exercise manual startup without hardware commands
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./build/Release/LenovoFanManual.exe -ArgumentList '--self-check' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Manual self-check timed out' }
          if ($process.ExitCode -ne 0) { throw 'Manual startup failed' }
      - name: Package manual test preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path manual-preview | Out-Null
          Copy-Item build/Release/LenovoFanManual.exe, LICENSE, MANUAL_TEST.md, THIRD_PARTY_NOTICES.md -Destination manual-preview
      - uses: actions/upload-artifact@v7
        with:
          name: LenovoFanCompanion-manual-test-windows-x64
          path: manual-preview/
          if-no-files-found: error
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
